<!doctype html>
<html lang="en" class="dark" data-theme="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Turn any VSL script into a conversion-ready sales page and an interactive quiz - generated from one shared analysis, so every asset tells the same story."
    />
    <title>VSL Studio - Sales pages and quizzes from your VSL</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint so there is no colour flash.
      try {
        var t = localStorage.getItem('vsl-studio.theme');
        if (t) document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('vsl-studio.surface');
        if (s && s !== 'midnight') document.documentElement.dataset.surface = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
